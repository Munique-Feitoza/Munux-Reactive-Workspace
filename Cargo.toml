[package]
name = "munux-reactive-workspace"
version = "0.2.0"
edition = "2021"
authors = ["Munique Alves Pacheco Feitoza"]
license = "GPL-3.0"
description = "A next-generation reactive terminal environment for education and productivity"
repository = "https://github.com/Munique-Feitoza/Munux-Reactive-Workspace"
keywords = ["terminal", "tui", "education", "gamification", "rust"]

[dependencies]
# UI & Terminal Handling
ratatui = "0.28.1"
crossterm = "0.27.0"
tui-textarea = "0.6.0"
ansi-to-tui = "6.0"
ssh2 = "0.9"

# System Info (Para o Monitor de CPU/RAM)
sysinfo = "0.30.5"

# Utilities
sys-locale = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
fluent = "0.16"
unic-langid = "0.9"
include_dir = "0.7"

# File system operations
walkdir = "2.4"

[dev-dependencies]
# Testing
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
